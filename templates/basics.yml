name: Basics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      # Checkout, Python, pnpm and Node come from the standard. Set them with inputs:
      # node, python, pnpm, cache. Everything below is this app's own work, in order.
      - uses: suadin/basic-specs/.github/actions/setup@v1.2.1
        with:
          cache: "true"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: python3 basics/check.py --root . check --run
