name: Registry

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 checks/registry.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: registry/update
          title: Update Basic Specs registry
          body: Generated from the public repositories with the `basic-specs` topic.
          commit-message: Update Basic Specs registry
          delete-branch: true
